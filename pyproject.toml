[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aic-transfuser-lite"
version = "0.1.0"
description = "Camera + 2D LiDAR TransFuser-style E2E driving starter scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "rosbags>=0.11,<0.12",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.scripts]
aic-e2e = "aic_transfuser_lite.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
