common:
  save_config: false

sim_logger:
  animation_enabled: false

map:
  # path from pkg share dir
  yaml_path: "env/final_ver3/occupancy_grid_map.yaml"

waypoints:
  # path from pkg share dir
  # csv_path: "maps/occupancy_grid_map_waypoints.csv"
  # 野口追記：（reference_path.csv_pathが空でない限り、この項目は無視される。
  # 今はreference_path.csv_pathを使っているので実質未使用）
  csv_path: ""

obstacles:
  # path from pkg share dir
  # 野口追記：（このセクション全体は、V2X（vehicle_positionsトピック）を使う
  # 自作の回避・減速・復帰ロジック（avoidance_logic.py/braking_logic.py/
  # recovery_logic.py）からは一切参照されない、別系統の静的障害物回避
  # 経路（Map.add_obstacles）向けの設定。ここを変えても本レースの
  # 挙動（回避・減速・復帰）には影響しない——変えるならまずどちらの
  # 経路を使っているか確認すること）
  csv_path: "" # If empty, the obstacles information will be subscribed from the topic
  # csv_path: "maps/occupancy_grid_map_obstacles.csv"
  radius: 1.25 # [m] 上記の静的障害物経路が使う想定半径。大きくすると障害物をより大きく（＝より遠くから）避けようとする

reference_path:
  update_by_topic: false # When true, 'circle' must be false
  # path from pkg share dir
  # csv_path: ""
  # csv_path: "env/final_ver3/churataro_v1_gui_v2.csv"
  csv_path: "env/final_ver3/in_corce_line_straight_smooth.csv"
  # 野口追記：（waypoint間隔[m]の目標値。ただし実際の間隔は
  # min(この値, 入力CSVの元の点間隔)にしかならない——
  # ReferencePath._construct_pathの再サンプリングは点を「間引く」方向
  # にしか動かず、元のCSVがこの値より粗い場合はCSV側の間隔がそのまま
  # 残る（2026-07-17、churataro_v1.csvで実際にハマった）。今の
  # traj_mincurv.csvは元々1m弱間隔なので、この値を0.6にしても実際は
  # 約1m間隔のまま——変えて効かせたいなら入力CSV自体を再サンプリング
  # する必要がある。この間隔は、MPCの空間ベースホライズン（N×間隔で
  # 前方への実到達距離が決まる。速度には依存しない、2026-07-20確認）
  # にも直接効く）
  resolution: 0.6
  # 野口追記：（参照パスの移動平均平滑化に使うwaypoint数。大きくすると
  # カーブがなだらかになる代わりコーナーの頂点がなまる（追従が遅れて
  # 見える）、小さくすると元のCSVの形状に忠実になる代わりノイズ・
  # ギザギザにも敏感になる）
  smoothing_distance: 2
  max_width: 6.0 # [m] マップから計算するコリドー幅の上限。実際の壁位置がこれより広くても、この値で頭打ちにする
  circular: true # 周回コースかどうか。false一周で終わる経路用（このコースでは変更不要）
  use_path_constraints_topic: false
  use_border_cells_topic: false
  # use_path_constraints_topic: true
  # use_border_cells_topic: true

bicycle_model:
  # 野口追記：（ホイールベース[m]。復帰処理・スクイーズの強制操舵が
  # 実際にどれだけ曲がるか（回転半径R=length/tan(操舵角)）に直接効く。
  # 実車と合わせる値なので通常は変更しない）
  length: 1.087
  # width: 1.45   # real machine width
  # 野口追記：（安全マージン込みの実効車幅[m]。減速判定
  # （collision_braking内の各種collision_distance）・復帰処理の
  # 前方/後方クリア判定（_recovery_direction_is_clear）が使う
  # 「本当にぶつからないための幅」。大きくするとより余裕を持って
  # 減速・停止判定するようになる（安全側だが早め・過敏になる）、
  # 小さくすると実車幅に近づき、ギリギリまで動こうとする）
  width: 2.30   # +safety margin

mpc:
  # 野口追記：（MPCホライズンのステップ数。2026-07-20確認: このMPCは
  # waypoint刻みの空間ベース定式化のため、ホライズンの物理的な前方
  # 到達距離は「N×waypoint実間隔」でほぼ決まり、速度には依存しない
  # （速度が下がっても縮まない）。本番実測でN=40・実間隔≈1mのとき
  # 到達距離は約24m。大きくすると先読みが増え、回避・減速のトリガーが
  # より早く反応できるが、MPCソルブが重くなる（mpc.solve時間に直結））
  N: 30
  # Q: [e_y, e_psi, t]
  # R: [v, delta]
  # QN: [e_y, e_psi, t]

  # R: [100000.0, 0.0]
  # R: [100000.0, 100.0]

  # ベイズ
  # R: [100000.0, 193.94901180720328]

  # 野口追記：（Rは[速度入力, 操舵入力]それぞれの「変化させることへの
  # ペナルティ」。値を大きくするとその入力の変化を渋るようになる
  # （速度側を上げる→加減速がより滑らかで穏やかに、操舵側を上げる→
  # 操舵がより滑らかだが応答が鈍くなる）。小さくすると追従は機敏になる
  # が、振動・過敏な挙動が出やすくなる）
  # 安定走行
  R: [10000.0, 50.0]

  # a_min: -1.6 # m/s^2
  # 野口追記：（最大減速度[m/s^2]、負値でどれだけ強くブレーキを踏めるか。
  # レギュレーション上限のあるa_maxと違い、こちらはこの値自体が
  # 「ぶつからない」ためのブレーキ性能の上限になる。絶対値を小さくする
  # （0に近づける）と急ブレーキが弱まり、減速判定が追突を防ぎきれなく
  # なるリスクが上がる）
  a_min: -10.0 # m/s^2

  # a_max: 0.7 # m/s^2
  # 野口追記：（★レギュレーション上限。加速度はこの値を絶対に超えては
  # いけない——上げてはいけないパラメータ。全ての速度目標（回避中・
  # 減速中・復帰中・スクイーズ中を含む全ての分岐）は最終的に
  # acc = KP*(target-v); clip(a_min, a_max) を通るので、このclipさえ
  # 守っていればどんな分岐からの速度指令でも安全という設計になっている）
  a_max: 0.999 # m/s^2（競技規則上限）

  # 野口追記：（車体の物理的な最大操舵角[度]。復帰処理・スクイーズが
  # 「ハンドルいっぱい」を表現する時の基準値になる（この値よりわずかに
  # 小さい値を使う設計規約）。実車のステアリング機構の限界なので、
  # 実車と合わない値にすると机上と実機の挙動がズレる）
  delta_max_deg: 32.0 # degrees

  # steer_rate_max: 0.35 # rad/s
  # 野口追記：（操舵角の最大変化速度[rad/s]。MPCソルブ内部
  # （core/MPC.py、max_delta_change = steer_rate_max * Ts）で、1制御周期
  # あたりの操舵角変化を強制的に制限する。小さくすると操舵が滑らかに
  # なる代わり、急なコーナーやS字（向きが数mで大きく変わる区間）で
  # 実際に曲がりきれず外側へ膨らみやすくなる。大きくすると追従性は
  # 上がるが、操舵が唐突になりやすい）
  # 公式AWSIMの0.6rad/sに合わせると、現行の離散経路が要求する切返しを
  # MPC内部で実現できず壁接触が増えるため、計画側には0.8rad/sを確保する。
  # 実アクチュエータの上限はAWSIM側で適用される。
  steer_rate_max: 0.8 # rad/s
  # 速度プロファイルが用いる実車側の操舵レート上限。MPC内部の可行性を
  # 保つ0.8とは分け、2026大会AWSIM/実機仕様の0.6で追従可能速度を作る。
  speed_profile_steer_rate_max: 0.6 # rad/s

  # 野口追記：（制御ループ周波数[Hz]。steer_rate_maxの実際の効き方
  # （Ts=1/control_rateが1周期あたりの操舵変化量に直結）や、各種ログの
  # 頻度（speed.diagは4Hz固定＝control_rate/10）に影響する。上げると
  # 制御・ログとも高頻度になり計算負荷が増える）
  control_rate: 30.0 # Hz
  # 野口追記：（操舵コマンド[rad]から実際のタイヤ切れ角への換算ゲイン。
  # 実車のステアリング機構の特性に合わせる値で、走行性能のチューニング
  # 用途では通常触らない）
  steering_tire_angle_gain_var: 1.639
  # steering_tire_angle_gain_var: 1.0
  # accel_low_pass_gain: 0.1
  # steer_low_pass_gain: 0.3
  # 野口追記：（加速度指令のローパスフィルタ係数。
  # acc = last_acc + (new_acc - last_acc) * gain という式で、
  # 1.0だと完全にフィルタが効かない（毎回そのままnew_accを使う）。
  # 小さくするほど加速度指令が滑らかになる代わり、実際の反応が遅れる）
  accel_low_pass_gain: 1.0
  # 野口追記：（操舵指令版の同じフィルタ。1.0でフィルタなし
  # （2026-07-20確認済み——この値のままなら「操舵に遅れがある」系の
  # 不具合の原因はこのフィルタではない、というのを切り分けるのに使える）。
  # 小さくすると操舵が滑らかになる代わり反応が遅れる）
  steer_low_pass_gain: 1.0
  # 野口追記：（2026-07-21、固定waypoint数オフセット(旧wp_id_offset)から
  # 実時間ベースの遅延補正に変更。演算・通信・アクチュエータの遅延合計を
  # 秒で指定し、毎tickの実速度から「その時間で進む距離」を
  # waypoint数に変換してwp_id_offset相当として使う（mpc_controller.py側で
  # 毎tick self._mpc.update_wp_id_offset() する）。固定waypoint数だと、
  # 低速では秒数換算で過剰補正・高速では補正不足になる不整合があった
  # （2025年大会2位「GAIOの夜明け」チームの公開レポートが同種の約0.2秒の
  # 操舵遅延を実測・補償していたのを参考に、0.2を出発点にする。未チューニング）。
  # 大きくすると遅延には強くなるが、直近の状況変化への反応が遅れる）
  actuator_delay_sec: 0.2
  # 野口追記：（trueの場合、MPCホライズン内で最も厳しい（絶対値が大きい）
  # 曲率を使って速度上限（vmax_dyn=sqrt(ay_max/|kappa|)）を決める
  # （＝この先のどこかにきついカーブがあれば早めに減速し始める、先読み型）。
  # falseだと各ステップごとのローカルな曲率だけで判定する（先読みせず、
  # カーブに差し掛かってから減速する形になり、間に合わず外側へ膨らむ
  # リスクが上がる））
  use_max_kappa_pred: false
  # use_max_kappa_pred: false


  ## ---------- 究極 ------------- ##
  ## Lap1: 53s, Lap2: 47s

  # v_max: 30.0   # km/h
  # ay_max: 12.0  # m/s^2, maximum lateral acceleration in curves
  # Q: [600000.0, 100000000.0, 2000000.0]
  # QN: [1000000.0, 1000000.0, 10000.0]

  ## --- 高速 (gnss delay 0.3) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 高速 (gnss delay 0.4) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 1850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 中高速 --- ##
  ## Lap1: 59s, Lap2: 54s
  # v_max: 25.0
  # ay_max: 7.0
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --------- 中速 -------------- ##
  ## Lap1: 67s, Lap2: 64s
  # 野口追記：（以下、現在有効な速度プロファイル。v_max/ay_max/Q/QNは
  # セットで一つの「走り方」を表す4点セットとして、上の各##ブロックの
  # ように丸ごと差し替えて使う設計——値だけ単体で変えるとバランスが
  # 崩れやすい）

  # v_max: 20.0
  # 野口追記：（車速の絶対上限[km/h]。区間速度（ref_vel.yaml）が
  # これより大きい値を指定していても、最終的にはこの値で頭打ちになる。
  # 上げるとより速く走れる可能性がある代わり、他の全ての安全マージン
  # （減速・回避の反応時間など）に必要な余裕が減る）
  v_max: 35.0
  # v_max: 15.0

  # ay_max: 6.5
  # ay_max: 70.0
  # 野口追記：（★2026-07-20実レースで発見。カーブでの速度上限を
  # vmax_dyn=sqrt(ay_max/|kappa|)で決める、その上限としての最大横
  # 加速度[m/s^2]。値が実際のコーナーの厳しさに対して大きすぎると
  # （例: ay_max=70・最もきついコーナーkappa≈0.2ならvmax_dyn≈66.5km/h
  # となり区間速度26km/hより遥かに上＝実質無制限）、カーブの曲率に
  # 応じた自動減速が全く効かなくなり、区間速度のまま突っ込んで曲がり
  # きれず壁にはらみ出る原因になった（複数回同じコーナーを通過し、
  # 進入速度が速い回だけ衝突する実測データで確認）。下げるとカーブでの
  # 自動減速が強く効くようになる代わり、直線的な区間でも不要に速度が
  # 落ちやすくなる可能性がある——実車の実際のグリップ限界に近い、
  # 現実的な値にするのが望ましい。この値で本当に効いているか確認したい
  # 時は、対象コーナーのkappaを控えてvmax_dynを計算し、区間速度
  # （ref_vel.yaml）と比較するとよい）
  ay_max: 15.0

  # Q: [3000000.0, 90000000.0, 100000.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  # QN: [1000000.0, 1000.0, 10000.0]

  # ベイズ
  # Q: [208822.39148708404, 102414627.45880057, 84792.94285682749]
  # QN: [1693104.3793435146, 574086.5268060965, 65861.39268621692]

  # 野口追記：（Q/QNは状態コスト[e_y, e_psi, t]（QNはホライズン終端のみに
  # 効く終端コスト）。e_y項を大きくすると横方向のズレ（コース中心からの
  # 逸脱）をより強く嫌うようになり、経路追従がタイトになる代わり
  # 操舵が忙しくなりやすい。e_psi項を大きくすると向きのズレをより強く
  # 嫌う（カーブの先の方向を早めに向こうとする）。t項は進行（時間・
  # 距離）の遅れに対するコストで、大きくすると前進をより優先する
  # （壁際で足踏みしにくくなる一方、多少無理をしてでも進もうとする）。
  # 3項のバランスが崩れると、片方だけ効きすぎて別の軸で暴れる形になり
  # やすいので、変えるときは小刻みに調整すること）
  # 安定走行
  Q: [3000000.0, 90000000.0, 800000.0]
  QN: [40000000.0, 2000.0, 80000.0]

  ## -------- 低速 -------------- ##
  ## Lap1: 86s

  # v_max: 15.0
  # ay_max: 5.5
  # Q: [5000000.0, 100000000.0, 200000.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  # QN: [1000000.0, 1000.0, 10000.0]

# 通常走行の大曲率区間だけ外部C++ CMA PPへ横・縦制御を切り替える。
# 切替時は現在位置から元の基準経路へlookahead_max_mの距離で合流する接続線を
# 一度だけ生成し、合流WPまでは同じ形状を保持する。それ以外の状態では、
# 指定元multi_purpose_mpc_rosの既存制御権限と出力をそのまま使用する。
curve_pure:
  enabled: true
  # 3点中央値で平滑化したabs(kappa)がこの値以上のwaypointを急曲率点とする。
  kappa_threshold: 0.18       # [1/m]
  # 急曲率点の手前からPureを開始し、通過後もしばらく維持する距離。
  preview_distance_m: 15.0   # [m]
  exit_distance_m: 3.0       # [m]
  median_window_size: 3      # 正の奇数
  # 曲率判定で分断される連続カーブをCurvePureでつなぐ。runtime WPの
  # 半開区間[start, end)で、WP191〜216、WP242〜248、WP272〜283、
  # WP305〜363、周回境界後のWP0〜24を指定する。回避開始後は
  # AVOID_PUREを優先する。
  # 経路差し替え時に同じWP番号を別の幾何へ誤適用しないよう点数も固定する。
  forced_wp_ranges_reference_waypoint_count: 364
  forced_wp_ranges: [[191, 217], [242, 249], [272, 284], [305, 364], [0, 25]]
  # Python側Pureの速度連動lookahead。maxはCMA進入接続線の合流距離にも使う。
  # 外部C++ CMAの実lookaheadはshadow launch側で2〜4mに設定する。
  lookahead_min_m: 2.0
  lookahead_max_m: 5.0

# 通常MPCの直線専用遠方プレビュー。MPCホライズン、曲率、速度、壁制約は
# 既存のまま使い、横・方位目標だけを「現在横位置からlookahead先の走行線へ
# 滑らかに収束する線」へ置き換える。回避・復帰・Curve Pure中は使用しない。
straight_preview:
  enabled: true
  lookahead_distance_m: 10.0
  # lookahead地点の直後がカーブなら、カーブ進入前に通常MPCへ戻す余裕距離。
  curve_clearance_distance_m: 5.0
  # 5点中央値で平滑化したabs(kappa)が、判定距離の全点でこの値以下なら直線。
  kappa_threshold: 0.08
  median_window_size: 5
  # 目標線のON/OFFをこの時間で0↔1へ混合し、切替自体の操舵段差を防ぐ。
  transition_time_sec: 0.5
  # 発進・強制動後の低速では通常MPCを維持する。
  min_speed_kmh: 18.0

# 1周目の第一直線は従来線を使い、最終カーブへ初めて到達した時点で
# Lap2以降用の線へ一度だけ切り替える。最終コーナはruntime wp330から外側へ
# 最大0.70m広げ、その出口をruntime wp24以降の第一直線の始点として使う。
# H2Hでwp51->54の壁接触を確認したため、runtime wp50付近から内側へ旋回し、
# 第一カーブ内で元線へsmoothstep接続する。直線内にtaperは入れない。
lap2_first_straight:
  enabled: true
  csv_path: "env/final_ver3/in_corce_line_lap2_first_straight_left.csv"
  activation_wp: 330

v2x_obstacle_avoidance:
  vehicle_radius: 0.5          # [m] 他車をこの半径の円とみなして各種collision_distance計算に使う。大きくすると他車をより大きく（＝より遠くから）避ける・減速するようになる
  # 物理接触判定用の向き付き車体矩形。wheelbaseであるbicycle_model.length
  # や、MPC壁制約用に膨らませたbicycle_model.widthとは別物。
  # racing_kart_description/config/vehicle_info.param.yamlの全長・全幅。
  vehicle_body_length_m: 2.064
  vehicle_body_width_m: 1.30
  # 野口追記：（回避判定専用の物理車幅[m]。実車幅(bicycle_model.width=
  # 2.30)とは別に、回避経路の生成・通過・減速解除
  # （collision_distance=judgement_ego_width_m/2+vehicle_radius）が
  # 使う物理値。実車幅より狭いのは、回避の計画（wall_clearance等）が
  # 別途実車幅ベースの安全マージンを持っているため。★2026-07-20実測:
  # ここを、他車が実際にいる横位置が「collision_braking側の実車幅基準
  # ゲートには入るが、この狭いゲートには入らない」帯にいると、減速は
  # ブロックと見なし続けるのに回避・スクイーズはどちらも反応しない
  # デッドゾーンが発生しうる（実レースで78秒の完全停止として発現、
  # スクイーズの入り口だけ減速と同じ実車幅基準へ変更して対処済み）。
  # IDLE時の発見だけはMPC制御幅でホライズンを太らせ、横から入る車を
  # 早めに候補化する。この値を大きくして発見を早める用途には使わない）
  # judgement_ego_width_m: 1.45 # [m], 回避判定専用の物理車幅
  judgement_ego_width_m: 1.60 # [m], 回避判定専用の物理車幅
  # ホライズンを用いる通行可否判定に限り、上の物理衝突距離から引く量[m]。
  # 現設定は1.60/2+0.50=1.30mを1.25mへ縮める。候補線生成・全車候補評価・
  # 選択済み線のpassabilityだけへ適用し、回避検出、TTC、解除、接触診断、
  # 縦BRAKEの判定距離は1.30mまたは各機能固有の従来値を維持する。
  passability_clearance_reduction_m: 0.05
  v_max_safety: 30.0           # [m/s] 回避関連処理が内部で使う安全側の速度上限（クリップ用）
  position_jump_threshold: 5.0 # [m] V2X位置がこの距離以上一気に飛んだら異常値として扱うしきい値。小さくすると本当に速い相対移動まで異常値扱いしてしまう恐れがある
  # 野口追記：（2026-07-21、ユーザー提案で線形補間ランプを全廃。以前は
  # shift_start_wp（自車最寄wp+shift_start_wp_offset）→max_shift_wp
  # の間で徐々に目標へ近づける設計だったが、「自車の真横から壁沿いに
  # 描き、MPCに追従させる」方式に変更したため、shift_start_wp_offset
  # 自体が不要になり削除した（スクイーズの強制操舵で採用したのと
  # 同じ「線形補間せず、局所的なコリドー境界でクランプするだけ」の
  # 考え方）。
  # max_shift_wp_offsetは今も使う: 対象車の最寄wpからのオフセットで、
  # この地点のコリドー境界を基準にシフト目標の"天井"(max_target_e_y)を
  # 決める。回避シフト経路自体は自車の真横（ホライズン先頭）から常に
  # このmax_target_e_yを狙い、各waypointごとに局所的なコリドー境界へ
  # クランプする——コリドーが狭い区間では自然に控えめな値になるため、
  # 安全性はそちらで担保される。0＝対象車の真横のコリドーを基準にする、
  # 負にすると対象車の手前のコリドーを基準にする、正にすると対象車を
  # 過ぎた後のコリドーを基準にする）
  max_shift_wp_offset: 3
  # 野口追記：（2026-07-22、二重マージンのバグ修正で再設計。回避シフト経路が
  # 狙う目標waypointのupper/lowerは、実はMPC自身のsafety_margin
  # （bicycle_model.width/sqrt(2)≈1.63m）で既に壁から内側に詰められた値
  # （core/reference_path.pyのupdate_path_constraints参照）。以前は
  # ここでさらにcar.width/2を引いていたため、実効クリアランスが
  # safety_margin+car.width/2≈2.78mにもなり、avoid_wall_extra_margin_mを
  # 0にしても壁から離れすぎる不具合があった。回避専用の独立パラメータとして
  # car.width/2を経由せず、この値そのものをupper/lowerからの追加クリアランス
  # として使う（実際の壁からの合計クリアランスはsafety_margin+この値）。
  # 大きくすると壁からより離れて回避しようとする分、通れる隙間の判定が
  # 厳しくなり回避できるケースが減る。小さくすると通れる判定が緩くなる
  # 代わり実際の壁クリアランスが減る）
  # 野口追記：（負値は不可——0にした時点で既にupper/lowerぴったりまで
  # 到達しており、負値にしてもクランプされて0と同じ結果にしかならない
  # ため、意味のない入力としてバリデーションで弾いている。もっと壁際まで
  # 詰めたいなら下のavoid_safety_margin_mを使う）
  avoid_wall_clearance_m: 0.0
  # 他車側の必要クリアランス端を0.0、安全壁境界を1.0とした回避線位置。
  # 0.50は中点、0.60は第2直線の実測3例で約11〜14cmだけ壁側へ寄る。
  avoid_wall_side_ratio: 0.60
  # 野口追記：（2026-07-22、ユーザー要望「回避実線の位置だけを純粋に
  # 調整したい」への対応で新設。avoid_wall_clearance_mの基準そのもの
  # （upper/lower）を決めているMPC本体のmodel.safety_margin
  # （bicycle_model.width/sqrt(2)≈1.63m）を、回避/Pureがreferenceを
  # 設定している間だけ上書きする（core/MPC.pyのset_lateral_reference()
  # 引数、get_control()のactive_safety_margin分岐を利用）。回避/Pureが
  # 終了すればmodel.safety_marginへ自動的に戻るため、通常走行・減速判定・
  # 復帰処理には一切影響しない。未設定（コメントアウトのまま）なら
  # model.safety_marginがそのまま使われ、挙動は変わらない。
  # 小さくするほど壁際まで攻める。試すなら、既存のjudgement_ego_width_m
  # （回避判定専用の実車幅寄りの値、1.45）/sqrt(2)≈1.03あたりが
  # 参考値になる）
  # 回避実線とMPC壁制約を同じ車体マージンに揃える。nullなら通常MPCの
  # bicycle_model.width/sqrt(2)をそのまま使い、回避中だけ壁制約を緩めない。
  avoid_safety_margin_m: null

  lead_hold_sec: 1.0 # [s] 対象車を追い抜いた（先行した）とみなしてから、この秒数継続して先行し続けたら回避を正常終了する。長くすると終了が慎重になる（誤って早期終了しにくい）が、回避状態が長引く
  # AVOIDING開始直後は、既存の終了条件を満たしてもこの秒数だけ解除しない。
  # 開始・終了のチャタリング対策はこの最小継続時間だけで行う。
  avoid_min_active_sec: 1.0
  # 対象車の通過完了後はRETURNINGへ入り、元の走行ラインをPure Pursuitで
  # 追従する。復帰開始時の横ずれから走行ラインまでは、始端・終端の傾きが
  # 0になるS字参照線で接続する。横ずれが大きい場合は、参照線の相対角が
  # return_s_curve_max_angle_degを超えないよう復帰距離を自動的に延長する。
  # ただし走行ラインから回避側の壁までの距離に対して、現在の壁離隔が
  # 小さいほど、壁から早く離れることを優先して
  # return_s_curve_wall_min_distance_mまで連続的に短縮する。
  # 走行ライン上なら通常距離、壁際ほど最短距離へ近づく。
  # 速度指令は変更せず、横ずれと向きが両方この範囲へ収束した周期だけMPCへ渡す。
  return_lateral_tolerance_m: 0.30
  return_heading_tolerance_deg: 10.0
  return_s_curve_min_distance_m: 10.0
  return_s_curve_wall_min_distance_m: 6.0
  return_s_curve_max_angle_deg: 18.0
  max_avoid_distance_m: 40.0 # [m] この距離より遠い他車は回避の対象候補にしない（直線距離）。大きくすると遠くの他車にも早めに反応するようになる
  # 野口追記：（回避トリガーの「有効ホライズン範囲」を、ホライズンの
  # 先端からどれだけ手前までに絞るかの比率。boundary_index=
  # (N-1)*(1-tip_ratio)で計算されるため、値が小さいほど有効範囲は
  # 広く（ホライズンのほぼ全域が有効）、大きいほど狭く（ホライズンの
  # 手前側だけが有効＝反応が遅れる）なる、直感と逆の向きなので注意）
  # 回避経路を生成するタイミング。対象車がホライズン先端側から70%まで
  # 近づいた時点でAVOIDINGへ入り、シフト実線だけを先に生成する。
  avoid_start_from_horizon_tip_ratio: 0.30
  # 生成済み回避経路をMPCへ渡して横移動を始めるタイミング。
  # 待機すると通常線上の対象へ減速して接近不能になるため、検知と同時に開始する。
  pure_start_from_horizon_tip_ratio: 0.30
  # 回避方向はAVOIDING開始時に選び、全前方車で塞がった場合だけ下記replan条件で
  # 1 episodeにつき一度だけ反転する。
  # 野口追記：（回避中、横方向の目標から作るe_psi（向き）参照の強さの
  # 倍率。1.0でフル、小さくすると操舵の唐突な変化を和らげる目的で使う。
  # 小さくしすぎると向きの補正が効きにくくなる）
  e_psi_reference_scale: 1.0
  # MPC操舵で回避線を追う制御周期だけ、stage costの横位置誤差Q[e_y]へ
  # 掛ける倍率。元Qは変更せずQP構築時の一時コピーだけを2倍にするため、
  # 通常MPC、直線preview、Pure Pursuit、RETURNINGへ倍率は残らない。
  # Q[e_psi]、QN、入力コスト、hard制約は変更しない。
  mpc_lateral_cost_scale: 2.0
  # 野口追記：（回避禁止区間。waypoint番号の[start, end)を列挙する。例: [[222, 250]]。
  # 2026-07-20、判定を強化：自車の「今いるwaypoint」1点だけでなく、MPC
  # ホライズン（現在地からNステップ先まで）がこの区間へ少しでも重複して
  # いれば回避を禁止する。区間に入ってからではなく、区間の手前から
  # 先回りして回避動作そのものを止めたい場合に使う。いつも同じ場所で
  # 事故る区間があるとき、そこを含む範囲を指定すると、その敵車をそもそも
  # 検知（回避トリガーの対象に）しなくなる）
  # disabled_wp_ranges: [[250, 280]]
  disabled_wp_ranges: []
  # 野口追記：（スクイーズ機能。IDLE中（まだ回避を開始できていない場合）:
  # 自車が低速（squeeze_trigger_speed_kmh以下）で他車が近くにいるのに、
  # 通常のホライズン交差判定が発火しない状態がsqueeze_trigger_sec続いたら、
  # 少しでも空いている側へねじ込む目標を強制的に生成しavoidanceを発火させる。
  # 2026-07-22、AVOIDING中の強制トレース発火経路（braking作動継続で発火し、
  # 幾何学的Pure Pursuitで回避シフト実線を直接トレースしていたもの）は
  # 削除した——復帰処理のALIGNING_FORWARDが同じPure Pursuitトレースを
  # 引き継いだため冗長と判断（ユーザー判断で削除。ただし発火条件が異なる
  # ——squeezeは自車が完全停止する前でも発火したが、復帰処理は速度がほぼ0に
  # なって初めて発火するため、「止まってはいないがなかなか抜けない」状況は
  # 復帰処理では拾えない、という指摘は残したまま削除した）
  squeeze_enabled: true # falseでスクイーズ機能を丸ごと無効化する
  # 野口追記：（この速度[km/h]以下が続いている時だけ、IDLE中のスクイーズ
  # 発火を検討する。上げるとより高い速度でも「停滞している」とみなして
  # 発火しやすくなる（誤発火のリスクも増える）、下げると本当にほぼ停止した
  # 時だけ発火するようになる）
  squeeze_trigger_speed_kmh: 4.0
  # 野口追記：（上記の条件が継続すべき秒数。短くすると停滞から素早く
  # 強制ねじ込みに移行する（早めに動き出せる反面、一時的な減速中の停滞にも
  # 過敏に反応しうる）、長くするとじっくり待ってから発火する）
  squeeze_trigger_sec: 3.0
  # 野口追記：（2026-07-22、幾何学的Pure Pursuitのlookahead距離[m]。実線上で
  # ego位置からこの距離だけ先の点をねらう。復帰処理ALIGNING_FORWARD中に
  # 回避シフト実線をトレースする際に使う。大きくすると滑らかだが反応が
  # 鈍くなる（曲がりが緩慢）、小さくすると鋭く反応する代わり振動しやすくなる）
  trace_lookahead_m: 1.5
  # AVOIDING中のPure Pursuit lookahead[m]。現在速度0でmin、MPCのv_maxで
  # maxとなるよう線形補間し、範囲外の速度は上下限へクランプする。
  pure_lookahead_min_m: 2.0
  pure_lookahead_max_m: 5.0
  # 通行可否は上記passability_clearance_reduction_m適用後の距離を使う。
  # 制御余裕込みのbicycle_model.widthは使わず、縦減速判定とも独立している。
  # pass_check_hold_sec: 通過可否判定を単発tickで信用せず、
  # 連続でこの秒数True であって初めて「確定passable」とする——このセッションで
  # 確認済みの「近傍ホライズン遅れ」的な過渡状態への安全策。旧
  # collision_braking.release_hold_secと同じ役目）
  pass_check_hold_sec: 0.5
  # Pure開始前後とも速度制御とcollision_brakingの判定は共通で、切り替える
  # のは横方向の追従方法だけとする。
  # 選択参照＋generation一致の実MPCホライズンのどちらかが、この秒数
  # 連続で塞がった場合に短絡候補再選択へ進む。1 tickでもclearならreset。
  # 旧「最低方向保持1.0秒」「反対clear 0.25秒」「追加margin 0.2m」
  # 「episode中1回だけ切替」は撤廃し、方向転換回数に上限を置かない。
  avoid_replan_blocked_hold_sec: 0.5

# 野口追記：（回避ロジックとは別の、他車追突回避のための減速判定。
# 2026-07-19、ペナルティが厳しいため「ぶつからない」を最優先にする方針転換。
# 従来のTTCトリガー＋クールダウン＋解除保持時間のラッチ式（ttc_threshold_sec/
# release_hold_sec/cooldown_sec/release_clearance_margin_mは廃止）をやめ、
# 毎tick参照パス基準で前方車両を探し直す方式にした。状態を持たないため
# 「クールダウンで一時的にオフになる期間」が存在しない＝常時アクティブ）
collision_braking:
  enabled: true              # falseで減速処理を丸ごと無効化する
  # 発進から第一カーブ進入までは縦追従制動を抑止し、横回避を優先する。
  # スタート位置を実測して循環waypoint進捗で判定するため、次周以降は再発火しない。
  launch_forward_guard_enabled: true
  launch_forward_guard_exit_wp: 52
  # 野口追記：（以前はここにmin_brake_speed_kmh（下限速度）があったが、
  # 相手車がその下限より遅い（例: 2km/h）と自車に相手より速い目標を出す
  # ことになり、必ず追突するバグの原因だったため撤廃した。目標速度は
  # 常に相手の実速度そのもの、決して上回らない）
  # 野口追記：（この距離[m]より前方（参照パス沿い）に他車がいなければ検知
  # 対象にしない。近すぎ・遠すぎの速度調整はfollow_distance_m/gainが担うので
  # ここは単純に「見る範囲」の上限。大きくすると遠くの他車にも早めに
  # 反応して減速し始める（早め安全だがラップタイムは犠牲になりやすい）、
  # 小さくすると近づくまで反応しない（ラップタイムには有利だが反応が
  # 遅れるリスクが上がる））
  max_gap_m: 17.0
  # 野口追記：（trueなら、減速中もMPCホライズン計画用の速度上限は減速の
  # 影響を受けない（実際に追従する目標速度だけが下がる）。回避シフトへの
  # 追従に余地を持たせたい場合にtrueにする。falseが従来通りの挙動。
  # falseにすると減速中は速度上限（update_v_max）まで下がり、MPCが
  # 横方向シフトへ追従する際の速度的な自由度が下がって、回避シフトへの
  # 追従が悪化しやすい——2026-07-19の実測で確認済み）
  relax_horizon_speed_cap: true
  # バンパー間で確保する目標車間。余剰車間を計画減速へ使い、この位置で
  # 前走車速度へ一致する。
  follow_distance_m: 2.0
  # H2H実測で継続して出せた減速度の下位25%値。遠方で前走車速度へ即時
  # 落とさず、この減速度で目標車間までに追従可能な速度上限を逆算する。
  planned_decel_mps2: 2.0
  # 野口追記：（2026-07-22、以前ここにあったjudgement_width_m/release_hold_sec
  # （通れるか否かの独立判定・MPC実測予測ホライズン依存）は廃止した。
  # ユーザー実験で「judgement_width_mを大きくしても停止車両を素通りする」
  # と判明（この上書きが効いていない側の一次ゲート＝実車幅ベースの
  # lateral_gate_mで素通りしていた）ことがきっかけで、判定を
  # v2x_obstacle_avoidanceの回避計画と同じ物理衝突距離（回避シフト実線
  # ベースの決定論的判定、_avoid_line_passable_confirmed）へ統一した。減速側は
  # 自前の判定を持たず、avoidance側が確定させた結果を読むだけになった）

# 野口追記：（復帰処理そのもののON/OFF。falseで復帰処理を丸ごと無効化する）
stuck_recovery:
  enabled: true
  # enabled: false
  # 野口追記：（2026-07-21、ユーザー報告「バックしすぎ」への対応でconfig化。
  # 後退（BACKING_UP）はrear_is_blocked（後方プローブ）か自車速度スタックの
  # どちらかを検知するまで続ける設計のため、後方が実際には塞がっていない
  # （よくあるケース。通常は前方の壁/他車に当たって復帰処理に入るため）
  # 場合、backing_up_timeout_secに達するまでずっと後退し続ける——つまり
  # この値が「後退の実質的な最大距離」を事実上決めている（目安:
  # |reverse_speed_mps| × backing_up_timeout_sec）。短くすると後退距離が
  # 短くなる（バックしすぎの直接対策）、長くすると本当に必要な時により
  # 長く下がれる）
  backing_up_timeout_sec: 3.0
  # 野口追記：（後退時の目標速度[m/s]、負値。絶対値を上げると同じ
  # backing_up_timeout_secでもより長い距離を後退する）
  reverse_speed_mps: -2.5
  # 野口追記：（2026-07-21、ユーザー提案。バック直後（STOPPING_TO_FORWARDの
  # 静止確認完了時）に、既にコース進行方向に沿い（heading）、コース中央
  # ＝シフト前の目標経路（参照パス自体）にも近ければ（lateral）、
  # ALIGNING_FORWARDを経由せず直接MPCへ制御を渡す。handback_heading_threshold_deg
  # を小さくするほど判定が厳しくなる（向きがより揃っていないと直接渡さない）。
  # handback_lateral_threshold_mを小さくするほど、より参照パスに近くないと
  # 直接渡さない。どちらも未チューニングの出発点）
  handback_heading_threshold_deg: 30.0
  handback_lateral_threshold_m: 1.0

# 野口追記：（ekf_localizer出力(kinematic_state)が真の位置から時間とともに
# ずれていく実測結果を受けた、GNSSによる位置補正のON/OFF）
gnss_position_correction:
  enabled: true

# 野口追記：（ブースト機能そのもののON/OFF。falseで発火条件判定・発火とも
# 丸ごと無効化する。なお、ベイズ探索用に実行時だけ止めたい場合は、これとは
# 別にROSパラメータ`disable_boost`（起動後にsetパラメータで変更可能）でも
# 止められる——こちらは設定ファイル起動時点でのデフォルト値であり、両方の
# どちらか一方でも無効化されていればブースト発火はしない）
boost:
  enabled: true
