format_version: aic_recovery_reference_generator_v1

# At the 0.75 m/s collection cap, the 4 m return produces measurable
# improvement inside the 3 s recovery gate. The approach is never training data.
phase_lengths_m:
  approach: 6.0
  hold: 3.0
  recovery: 4.0

minimum_segment_gap_m: 8.0

# Official MPC effective half width (2.30 / 2) plus wall margin (0.25).
minimum_center_clearance_m: 1.40
geometry_curvature_threshold_inv_m: 0.015
preferred_abs_curvature_inv_m: 0.050

# The generator chooses the exact non-overlapping intervals from map clearance
# and base-path curvature. Positive/left is the Reference left normal.
segments:
  - segment_id: left_far_left_curve
    side: left
    offset_m: 0.55
    geometry: left_curve
  - segment_id: right_far_right_curve
    side: right
    offset_m: 0.55
    geometry: right_curve
  - segment_id: left_near_right_curve
    side: left
    offset_m: 0.35
    geometry: right_curve
  - segment_id: right_near_left_curve
    side: right
    offset_m: 0.35
    geometry: left_curve
