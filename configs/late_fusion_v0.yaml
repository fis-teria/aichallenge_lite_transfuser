project:
  name: aic_late_fusion
  version: v0.1
  seed: 42

data:
  image_height: 180
  image_width: 320
  lidar_points: 1080
  lidar_min_range_m: 0.05
  lidar_max_range_m: 30.0
  ego_dim: 5
  num_waypoints: 6
  mode_classes:
    follow: 0
    avoid_left: 1
    avoid_right: 2
    overtake: 3
    return_to_center: 4
    stop: 5

model:
  name: late_fusion
  hidden_dim: 128
  camera:
    backbone: resnet18
    pretrained: false
    token_h: 4
    token_w: 4
  lidar:
    token_count: 32
  dropout: 0.1

loss_weights:
  waypoint: 1.0
  speed: 0.3
  stop: 1.0
  # Current MCAP labels only provide follow/stop proxy modes.
  mode: 0.0
  direct_control: 0.2
  smoothness: 0.05

training:
  batch_size: 64
  epochs: 30
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.01
  mixed_precision: true
  num_workers: 8
