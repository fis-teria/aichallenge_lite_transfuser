project:
  name: aic_lidar_only
  version: v0.1
  seed: 42

data:
  image_height: 180
  image_width: 320
  lidar_points: 1080
  lidar_min_range_m: 0.05
  lidar_max_range_m: 30.0
  ego_dim: 5
  num_waypoints: 6
  mode_classes:
    follow: 0
    avoid_left: 1
    avoid_right: 2
    overtake: 3
    return_to_center: 4
    stop: 5

model:
  name: lidar_only
  hidden_dim: 128
  lidar:
    token_count: 64
  heads:
    direct_control_aux: true

loss_weights:
  waypoint: 1.0
  speed: 0.3
  stop: 1.0
  mode: 0.0
  direct_control: 0.2
  smoothness: 0.05

training:
  batch_size: 128
  epochs: 20
  optimizer: adamw
  learning_rate: 0.0005
  weight_decay: 0.01
  mixed_precision: true
  num_workers: 8
  grad_clip_norm: 5.0
