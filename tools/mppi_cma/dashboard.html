<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPPI 経路探索</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1727;color:#e7edf7;font:16px system-ui,sans-serif;padding:26px}
h1{font-size:27px;letter-spacing:.05em;margin:0 0 8px}h2{font-size:17px;margin:0 0 12px}.muted{color:#a5b5cc;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.pill{padding:7px 13px;border:1px solid #3d6473;border-radius:20px;color:#77e3c3;font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.card{background:#18243a;border:1px solid #2b3a51;padding:18px;border-radius:12px}
.big{font-size:32px;font-weight:650;font-variant-numeric:tabular-nums;margin:9px 0 3px}.unit{font-size:15px;color:#a5b5cc}
progress{width:100%;height:8px;accent-color:#6bcbbb;margin:12px 0}.live{display:flex;justify-content:space-between;gap:10px;margin:12px 0 2px}
canvas{width:100%;height:460px;background:#121e31;border-radius:8px}.legend{display:flex;gap:18px;margin-top:8px;font-size:12px}
.simgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.simcard{padding:11px;background:#111d30;border-left:3px solid #80afff;border-radius:5px;font-size:12px}.simcard strong{display:block;font-size:19px;margin-top:5px}
.blue{color:#80afff}.green{color:#68e5b7}.red{color:#ff9b9b}.gray{color:#9aa8bb}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:right;padding:9px 5px;border-bottom:1px solid #2b3a51;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{color:#a5b5cc;font-weight:500}.scroll{max-height:320px;overflow:auto}
</style>
<div class="top"><div><h1 id="title">MPPI 経路探索</h1><span class="muted" id="subtitle">オーバーテイクレーンを避ける走行ラインを探索</span></div><span class="pill" id="phase">接続中</span></div>
<div class="cards" id="cards"></div>
<div class="card"><div class="top" style="margin:0"><h2 id="active">走行準備中</h2><span class="muted" id="fresh"></span></div>
<div id="simulations" class="simgrid"></div>
<div class="live" id="single-live"><div><span class="muted">実速度（車両の計測値）</span><div class="big" id="speed">—</div></div><div><span class="muted">目標速度</span><div class="big" id="target">—</div></div><div><span class="muted">周回 / 順位</span><div class="big" id="lap">—</div></div></div>
<canvas id="map"></canvas><div class="legend"><span class="gray">─ 元の経路</span><span class="muted" id="route-legend">候補の経路・車両は上のカードと同色</span><span class="red">■ オーバーテイクレーン</span></div></div>
<div class="card" style="margin-top:14px"><h2>評価結果</h2><div class="muted" style="margin-bottom:9px">侵入時間は車体外形＋10 cmで判定。ラップは2周目。候補の最良値は再走行で確認します。</div><div class="scroll"><table><thead><tr><th>候補</th><th>ラップ (s)</th><th>侵入 (s)</th><th>接触・逸脱</th><th>判定</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<p class="muted" id="budget"></p>
<script>
const $=id=>document.getElementById(id), n=(v,d=2)=>typeof v==='number'?v.toFixed(d):'—', colors=['#80afff','#ffce73','#c29bff','#68e5b7'];let latest=null;
function draw(s){const c=$('map'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const ctx=c.getContext('2d');ctx.scale(d,d);
const pts=s.baseline.concat(s.ot_polygon),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
const scale=Math.min((r.width-60)/(Math.max(...xs)-Math.min(...xs)+10),(r.height-40)/(Math.max(...ys)-Math.min(...ys)+10));
const xy=p=>[(p[0]-cx)*scale+r.width/2,r.height/2-(p[1]-cy)*scale];
function line(p,color,w,fill=false){if(!p.length)return;ctx.beginPath();p.forEach((v,i)=>{const q=xy(v);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke();if(fill){ctx.fillStyle=color+'55';ctx.fill()}}
line(s.baseline,'#78879d',2);line(s.ot_polygon,'#fa8585',2,true);
if(s.completed&&s.study_kind==='refinement'){['normal','leader'].forEach((key,i)=>line(s.conditions[key]?.selected_reference||[],colors[i],2));return}
(s.simulations||[{reference:s.reference,live:s.live}]).forEach((sim,i)=>{line(sim.reference,colors[i%4],1.8);const e=sim.live.ego;if(e){const q=xy([e.x_m,e.y_m]);ctx.save();ctx.translate(...q);ctx.rotate(-e.yaw_rad);ctx.fillStyle=colors[i%4];ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-6,-5);ctx.lineTo(-4,0);ctx.lineTo(-6,5);ctx.closePath();ctx.fill();ctx.restore()}})}
function render(s){latest=s;const shared=s.mode==='shared_course',refining=s.study_kind==='refinement',limit=s.candidate_limit_per_condition||18;$('title').textContent=refining?'MPPI · CMA-ES 経路の再探索':shared?'MPPI · 同一コース4台ゴースト':'MPPI 経路探索';$('subtitle').textContent=refining?(shared?'通常10 m/s · 同一コース・D1同一位置の4台 · 他車入力なし':'1位固定ハンデ7.5 m/s · 独立した4環境'):shared?(s.start_mode==='d1'?'全車D1の同じ位置から開始 · ':'')+'車同士の衝突なし · 制御への他車入力なし · 1位ハンデは実順位に連動':'オーバーテイクレーンを避ける走行ラインを探索';$('phase').textContent=s.phase==='error'?'要確認':s.completed?(shared&&!refining?'4台走行の確認 完了':'探索・再検証 完了'):s.phase==='validation'?'新旧経路を比較中':'探索中';$('cards').style.display=shared&&!refining?'none':'grid';
$('cards').innerHTML=['normal','leader'].map((key,i)=>{const q=s.conditions[key]||{},best=q.best,v=best?.measured_speed_median_mps,lap=q.comparison?(q.comparison.promoted?q.comparison.candidate_median_s:q.comparison.incumbent_median_s):best?.flying_lap_s;return `<div class="card" style="border-top-color:${colors[i]}"><h2>${i?'1位ハンデあり · 7.5 m/s':'通常 · 10 m/s'}</h2><span class="muted">${q.comparison?'採用経路の4走行中央値':'侵入なしの最良ラップ'}</span><div class="big">${n(lap)} <span class="unit">s</span></div><div class="muted">代表走行の実速度中央値 ${n(v)} m/s (${n(typeof v==='number'?v*3.6:null,1)} km/h)</div><progress value="${q.candidate_count||0}" max="${limit}"></progress><div class="muted">候補 ${q.candidate_count||0} / ${limit}　${q.validated===true?(refining?(q.comparison?.promoted?'新しい経路を採用':'前回の経路を継続'):'3走行で確認済み'):q.validated===false?'再走行で条件外あり':q.validation_count?'再走行を確認中':'再走行は未確定'}</div></div>`}).join('');
$('active').textContent=shared?(s.completed?'4台走行の最終結果':s.active||'4台の起動を準備中'):s.simulations?.length>1?`${s.simulations.length}環境を並列評価中`:(s.active||(s.completed?'全条件の評価が完了':'次の候補を準備中'));$('fresh').textContent=s.last_error|| (s.completed?'最終結果':s.sample_age_s==null?'起動待ち':s.sample_age_s>5?'データ更新待ち':'ライブ更新');
$('simulations').innerHTML=(s.simulations||[]).map((q,i)=>{const a=q.live.status,v=shared&&s.completed?q.measured_median_mps:q.live.ego?.speed_mps;return `<div class="simcard" style="border-color:${colors[i%4]}">${q.episode}<strong>実速度${shared&&s.completed?'中央値':''} ${n(v)} m/s <span class="unit">(${n(typeof v==='number'?v*3.6:null,1)} km/h)</span></strong><span class="muted">目標 ${n(q.target_mps,1)} m/s　${a?`${Math.round(a[1])} / 2周 ・ ${Math.round(a[4])}位`:'起動中'}　${q.handicap?(shared?'1位にハンデ':'ハンデあり'):'通常'}</span></div>`}).join('');
$('single-live').style.display=s.completed||s.simulations?.length>1?'none':'flex';
$('route-legend').textContent=s.completed&&refining?'青：通常の採用経路 ／ 黄：1位ハンデありの採用経路':'候補の経路・車両は上のカードと同色';
const speed=s.live.ego?.speed_mps;$('speed').innerHTML=n(speed)+' <span class="unit">m/s ・ '+n(typeof speed==='number'?speed*3.6:null,1)+' km/h</span>';$('target').innerHTML=n(s.target_mps,1)+' <span class="unit">m/s</span>';
const a=s.live.status;$('lap').textContent=a?`${Math.round(a[1])} / 2周 ・ ${Math.round(a[4])}位`:'—';
const records=Object.values(s.conditions).flatMap(q=>q.evaluations).reverse();$('rows').innerHTML=records.map(m=>`<tr><td>${m.candidate_id||m.episode}</td><td>${m.completed?n(m.flying_lap_s):'—'}</td><td class="${m.ot_overlap_s?'red':'green'}">${n(m.ot_overlap_s)}</td><td>${['crash','wall','over'].reduce((a,k)=>a+m.penalties[k],0)}</td><td class="${m.preferred_feasible?'green':'muted'}">${m.preferred_feasible?(shared?'確認OK':'候補採用可'):m.completed?'条件外':'未完走'}</td></tr>`).join('');
$('budget').textContent=refining?`今回の評価 ${s.started_count} / 最大 ${s.maximum}台分 · 各24候補＋新旧4走行ずつ · 2秒ごとに更新`:shared?`同一コース4台 × ${s.started_count} / 最大 ${s.maximum}レース · 他車入力を遮断した経路確認 · 2秒ごとに更新`:`今回の追加評価 ${s.started_count} / 最大 ${s.maximum}走行 · 2秒ごとに更新`;draw(s)}
async function poll(){try{const r=await fetch('/api/state');if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){$('fresh').textContent='更新待ち: '+e.message}setTimeout(poll,2000)}window.addEventListener('resize',()=>latest&&draw(latest));poll();
</script></html>
