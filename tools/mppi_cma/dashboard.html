<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MPPI 経路探索</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0e1727;color:#e7edf7;font:16px system-ui,sans-serif;padding:26px}
h1{font-size:27px;letter-spacing:.05em;margin:0 0 8px}h2{font-size:17px;margin:0 0 12px}.muted{color:#a5b5cc;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.pill{padding:7px 13px;border:1px solid #3d6473;border-radius:20px;color:#77e3c3;font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}.card{background:#18243a;border:1px solid #2b3a51;padding:18px;border-radius:12px}
.big{font-size:32px;font-weight:650;font-variant-numeric:tabular-nums;margin:9px 0 3px}.unit{font-size:15px;color:#a5b5cc}
progress{width:100%;height:8px;accent-color:#6bcbbb;margin:12px 0}.live{display:flex;justify-content:space-between;gap:10px;margin:12px 0 2px}
canvas{width:100%;height:460px;background:#121e31;border-radius:8px}.legend{display:flex;gap:18px;margin-top:8px;font-size:12px}
.blue{color:#80afff}.green{color:#68e5b7}.red{color:#ff9b9b}.gray{color:#9aa8bb}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:right;padding:9px 5px;border-bottom:1px solid #2b3a51;font-variant-numeric:tabular-nums}th:first-child,td:first-child{text-align:left}th{color:#a5b5cc;font-weight:500}.scroll{max-height:320px;overflow:auto}
</style>
<div class="top"><div><h1>MPPI 経路探索</h1><span class="muted">オーバーテイクレーンを避ける走行ラインを探索</span></div><span class="pill" id="phase">接続中</span></div>
<div class="cards" id="cards"></div>
<div class="card"><div class="top" style="margin:0"><h2 id="active">走行準備中</h2><span class="muted" id="fresh"></span></div>
<div class="live"><div><span class="muted">現在速度</span><div class="big" id="speed">—</div></div><div><span class="muted">目標速度</span><div class="big" id="target">—</div></div><div><span class="muted">周回 / 順位</span><div class="big" id="lap">—</div></div></div>
<canvas id="map"></canvas><div class="legend"><span class="gray">─ 元の経路</span><span class="blue">─ 評価中の経路</span><span class="green">● 車両</span><span class="red">■ オーバーテイクレーン</span></div></div>
<div class="card" style="margin-top:14px"><h2>評価結果</h2><div class="muted" style="margin-bottom:9px">侵入時間は車体外形＋10 cmで判定。ラップは2周目。候補の最良値は再走行で確認します。</div><div class="scroll"><table><thead><tr><th>候補</th><th>ラップ (s)</th><th>侵入 (s)</th><th>接触・逸脱</th><th>判定</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<p class="muted" id="budget"></p>
<script>
const $=id=>document.getElementById(id), n=(v,d=2)=>typeof v==='number'?v.toFixed(d):'—';let latest=null;
function draw(s){const c=$('map'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const ctx=c.getContext('2d');ctx.scale(d,d);
const pts=s.baseline.concat(s.ot_polygon),xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
const scale=Math.min((r.width-60)/(Math.max(...xs)-Math.min(...xs)+10),(r.height-40)/(Math.max(...ys)-Math.min(...ys)+10));
const xy=p=>[(p[0]-cx)*scale+r.width/2,r.height/2-(p[1]-cy)*scale];
function line(p,color,w,fill=false){if(!p.length)return;ctx.beginPath();p.forEach((v,i)=>{const q=xy(v);i?ctx.lineTo(...q):ctx.moveTo(...q)});ctx.closePath();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.stroke();if(fill){ctx.fillStyle=color+'55';ctx.fill()}}
line(s.baseline,'#78879d',2);line(s.ot_polygon,'#fa8585',2,true);line(s.reference,'#80afff',2.3);
const e=s.live.ego;if(e){const q=xy([e.x_m,e.y_m]);ctx.save();ctx.translate(...q);ctx.rotate(-e.yaw_rad);ctx.fillStyle='#68e5b7';ctx.beginPath();ctx.moveTo(9,0);ctx.lineTo(-6,-5);ctx.lineTo(-4,0);ctx.lineTo(-6,5);ctx.closePath();ctx.fill();ctx.restore()}}
function render(s){latest=s;$('phase').textContent=s.completed?'探索・再検証 完了':s.phase==='validation'?'再走行で検証中':'探索中';
$('cards').innerHTML=['normal','leader'].map((key,i)=>{const q=s.conditions[key]||{},best=q.best;return `<div class="card"><h2>${i?'1位ハンデあり · 7.5 m/s':'通常 · 10 m/s'}</h2><span class="muted">侵入なしの最良ラップ</span><div class="big">${n(best?.flying_lap_s)} <span class="unit">s</span></div><progress value="${q.candidate_count||0}" max="18"></progress><div class="muted">候補 ${q.candidate_count||0} / 18　${q.validated===true?'3走行で確認済み':q.validated===false?'再走行で条件外あり':q.validation_count?'再走行を確認中':'再走行は未確定'}</div></div>`}).join('');
$('active').textContent=s.active||'全条件の評価が完了';$('fresh').textContent=s.completed?'最終結果':s.sample_age_s==null?'起動待ち':s.sample_age_s>5?'候補切り替え中':'ライブ更新';
$('speed').innerHTML=n(s.live.ego?.speed_mps)+' <span class="unit">m/s</span>';$('target').innerHTML=n(s.target_mps,1)+' <span class="unit">m/s</span>';
const a=s.live.status;$('lap').textContent=a?`${Math.round(a[1])} / 2周 ・ ${Math.round(a[4])}位`:'—';
const records=Object.values(s.conditions).flatMap(q=>q.evaluations).reverse();$('rows').innerHTML=records.map(m=>`<tr><td>${m.episode}</td><td>${n(m.flying_lap_s)}</td><td class="${m.ot_overlap_s?'red':'green'}">${n(m.ot_overlap_s)}</td><td>${['crash','wall','over'].reduce((a,k)=>a+m.penalties[k],0)}</td><td class="${m.preferred_feasible?'green':'muted'}">${m.preferred_feasible?'候補採用可':m.completed?'侵入あり':'未完走'}</td></tr>`).join('');
$('budget').textContent=`今回の追加評価 ${s.started_count} / 最大 ${s.maximum}走行 · 2秒ごとに更新`;draw(s)}
async function poll(){try{const r=await fetch('/api/state');if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){$('fresh').textContent='更新待ち: '+e.message}setTimeout(poll,2000)}window.addEventListener('resize',()=>latest&&draw(latest));poll();
</script></html>
