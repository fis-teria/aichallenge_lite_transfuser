<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="{{description}}"
    />
    <meta name="theme-color" content="#132c32" />
    <title>{{title}} — AIC TransFuser Lite</title>
    <link rel="icon" href="{{root}}assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="{{root}}assets/style.css" />
    <script src="{{root}}assets/site.js" defer></script>
  </head>
  <body data-page="{{page}}">
    <a class="skip" href="#main">本文へ移動</a>
    <header class="topbar">
      <button
        class="menu-toggle"
        type="button"
        aria-label="サイドメニューを開く"
        aria-controls="project-menu"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path
            d="M4 6h16M4 12h16M4 18h16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </button>
      <a class="brand" href="{{root}}index.html"
        ><img src="{{root}}assets/mark.svg" alt="" width="32" height="32" /><span
          >AIC <strong>TransFuser Lite</strong></span
        ></a
      >
      <div class="toplinks">
        <span class="edition">RESEARCH NOTES / 2026</span
        ><a href="https://github.com/fis-teria/aichallenge_lite_transfuser"
          >GitHub <span aria-hidden="true">↗</span></a
        >
      </div>
    </header>
    <div class="menu-backdrop" hidden></div>
    <div class="shell">
      <aside class="sidebar" id="project-menu" aria-labelledby="menu-heading">
        <div class="sidebar-heading">
          <p class="eyebrow" id="menu-heading">PROJECT EXPLORER</p>
          <button
            class="menu-close"
            type="button"
            aria-label="サイドメニューを閉じる"
          >
            ×
          </button>
        </div>
        {{navigation}}
        <div class="sidebar-note">
          <span class="dot"></span> 開発・検証中
          <p>最終目標は、安定した完走、<br />障害物回避、回避不能時停止。</p>
          <a href="{{root}}index.html#sources">資料と更新方針 ↘</a>
        </div>
      </aside>
      <main id="main">{{content}}
<footer><span>AIC TransFuser Lite / Research Notes</span><a href="#main">ページの先頭へ ↑</a>
<p>Research in progress. Evidence before claims.</p></footer></main></div></body></html>
